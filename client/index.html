<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Eventos climáticos extremos</title>
</head>
<body>
    <header id="titulo"><h1>Registro de Eventos Climáticos Extremos</h1></header>
    <main>
        <section>
            <form action="http://localhost:3000/dados" method="post">
                <input type="text" name="cidade" placeholder="Nome da cidade" required>
                <input type="text" name="tipo_evento" placeholder="Tipo de evento" required>
                <input type="number" step="0.01" name="temperatura_maxima" placeholder="Temperatura máxima" required>
                <input type="date" name="data" required>
                <input type="text" name="nivel_impacto" placeholder="Nível de impacto" required>
                
                <input id = "enviar" type="submit" value="Enviar">
            </form>
        </section>
        <section>
            <table>
                <thead>
                    <th>Cidade</th>
                    <th>Tipo de Evento</th>
                    <th>Temperatura Máxima</th>
                    <th>Data</th>
                    <th>Nível de Impacto</th>
                </thead>
                <tbody id="tabela">
                    <script>
                        fetch('http://localhost:3000/dados')
                        .then(resp => resp.json())
                        .then(resp =>{
                            resp.forEach(p=>{
                                const linha = document.createElement('tr')
                                linha.innerHTML = `
                                    <td>${p.cidade}</td>
                                    <td>${p.tipo_evento}</td>
                                    <td>${p.temperatura_maxima}</td>
                                    <td>${p.data}</td>
                                    <td>${p.nivel_impacto}</td>
                                `         
                                tabela.appendChild(linha)
                            })
                        })
                    </script>
                </tbody>
            </table>
        </section>
    </main>
    <footer><h2>by Lucky17-10001</h2></footer>
</body>
</html>
